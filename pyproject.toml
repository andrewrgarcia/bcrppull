[project]
name = "bcrppull"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "bcrpy>=3.4.0",
    "matplotlib>=3.10.8",
    "pandas",
    "pyarrow",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bcrppull*"]
